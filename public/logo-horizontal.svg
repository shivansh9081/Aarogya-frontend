<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <radialGradient id="bgH" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2A8A60"/>
      <stop offset="100%" stop-color="#1B6B4D"/>
    </radialGradient>
  </defs>

  <!-- ── MANDALA ICON (left, 120x120) ── -->
  <g transform="translate(60,60)">
    <!-- Background circle -->
    <circle r="56" fill="url(#bgH)"/>
    <circle r="56" fill="none" stroke="#0F4C3A" stroke-width="2"/>

    <!-- 8 outer petals -->
    <ellipse rx="4" ry="9" fill="#E8F3F0" opacity="0.9" transform="rotate(0)   translate(0,-48)"/>
    <ellipse rx="4" ry="9" fill="#E8F3F0" opacity="0.9" transform="rotate(45)  translate(0,-48)"/>
    <ellipse rx="4" ry="9" fill="#E8F3F0" opacity="0.9" transform="rotate(90)  translate(0,-48)"/>
    <ellipse rx="4" ry="9" fill="#E8F3F0" opacity="0.9" transform="rotate(135) translate(0,-48)"/>
    <ellipse rx="4" ry="9" fill="#E8F3F0" opacity="0.9" transform="rotate(180) translate(0,-48)"/>
    <ellipse rx="4" ry="9" fill="#E8F3F0" opacity="0.9" transform="rotate(225) translate(0,-48)"/>
    <ellipse rx="4" ry="9" fill="#E8F3F0" opacity="0.9" transform="rotate(270) translate(0,-48)"/>
    <ellipse rx="4" ry="9" fill="#E8F3F0" opacity="0.9" transform="rotate(315) translate(0,-48)"/>

    <!-- Saffron dots -->
    <g fill="#FF9933">
      <circle r="2" transform="rotate(0)   translate(0,-36)"/>
      <circle r="2" transform="rotate(45)  translate(0,-36)"/>
      <circle r="2" transform="rotate(90)  translate(0,-36)"/>
      <circle r="2" transform="rotate(135) translate(0,-36)"/>
      <circle r="2" transform="rotate(180) translate(0,-36)"/>
      <circle r="2" transform="rotate(225) translate(0,-36)"/>
      <circle r="2" transform="rotate(270) translate(0,-36)"/>
      <circle r="2" transform="rotate(315) translate(0,-36)"/>
    </g>

    <!-- Rings -->
    <circle r="33" fill="none" stroke="#E8F3F0" stroke-width="1" opacity="0.5"/>
    <circle r="29" fill="none" stroke="#E8F3F0" stroke-width="0.7" opacity="0.3"/>

    <!-- Inner petals -->
    <g opacity="0.5">
      <ellipse rx="2" ry="5" fill="#E8F3F0" transform="rotate(22.5)  translate(0,-30)"/>
      <ellipse rx="2" ry="5" fill="#E8F3F0" transform="rotate(67.5)  translate(0,-30)"/>
      <ellipse rx="2" ry="5" fill="#E8F3F0" transform="rotate(112.5) translate(0,-30)"/>
      <ellipse rx="2" ry="5" fill="#E8F3F0" transform="rotate(157.5) translate(0,-30)"/>
      <ellipse rx="2" ry="5" fill="#E8F3F0" transform="rotate(202.5) translate(0,-30)"/>
      <ellipse rx="2" ry="5" fill="#E8F3F0" transform="rotate(247.5) translate(0,-30)"/>
      <ellipse rx="2" ry="5" fill="#E8F3F0" transform="rotate(292.5) translate(0,-30)"/>
      <ellipse rx="2" ry="5" fill="#E8F3F0" transform="rotate(337.5) translate(0,-30)"/>
    </g>

    <!-- Center disc -->
    <circle r="23" fill="#0F4C3A" opacity="0.35"/>
    <circle r="23" fill="none" stroke="#E8F3F0" stroke-width="1" opacity="0.5"/>

    <!-- LEAF (top) -->
    <g transform="translate(0,-12)">
      <path d="M0,-8 C4.5,-6 6,-1.5 3.5,3.5 C2,6 -2,6 -3.5,3.5 C-6,-1.5 -4.5,-6 0,-8 Z"
        fill="#E8F3F0" stroke="#1B6B4D" stroke-width="0.5"/>
      <line x1="0" y1="3.5" x2="0" y2="7" stroke="#1B6B4D" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="0" y1="-4" x2="-2.5" y2="-0.5" stroke="#1B6B4D" stroke-width="0.5" opacity="0.7"/>
      <line x1="0" y1="-2" x2="-3"   y2="1.5"  stroke="#1B6B4D" stroke-width="0.5" opacity="0.7"/>
      <line x1="0" y1="-4" x2="2.5"  y2="-0.5" stroke="#1B6B4D" stroke-width="0.5" opacity="0.7"/>
      <line x1="0" y1="-2" x2="3"    y2="1.5"  stroke="#1B6B4D" stroke-width="0.5" opacity="0.7"/>
    </g>

    <!-- BUILDING (lower-left) -->
    <g transform="translate(-9,8)">
      <rect x="-5" y="-6" width="10" height="10" rx="0.8" fill="#E8F3F0" stroke="#1B6B4D" stroke-width="0.5"/>
      <rect x="-5" y="-8.5" width="10" height="3" rx="0.5" fill="#FF9933"/>
      <rect x="-4" y="-4" width="2.5" height="2.5" rx="0.3" fill="#1B6B4D" opacity="0.8"/>
      <rect x="-0.8" y="-4" width="2.5" height="2.5" rx="0.3" fill="#1B6B4D" opacity="0.8"/>
      <rect x="2.5" y="-4" width="2.5" height="2.5" rx="0.3" fill="#1B6B4D" opacity="0.8"/>
      <rect x="-4" y="-0.5" width="2.5" height="2.5" rx="0.3" fill="#1B6B4D" opacity="0.6"/>
      <rect x="-0.8" y="-0.5" width="2.5" height="2.5" rx="0.3" fill="#1B6B4D" opacity="0.6"/>
      <rect x="2.5" y="-0.5" width="2.5" height="2.5" rx="0.3" fill="#1B6B4D" opacity="0.6"/>
    </g>

    <!-- HEART (lower-right) -->
    <g transform="translate(9,8)">
      <path d="M0,6 L-6,-1.5 C-6,-4.5 -3,-7 0,-4.5 C3,-7 6,-4.5 6,-1.5 Z"
        fill="#E8F3F0" stroke="#1B6B4D" stroke-width="0.5"/>
      <circle cx="0"  cy="-1" r="1.2" fill="#FF9933"/>
      <circle cx="-3" cy="2"  r="0.9" fill="#FF9933" opacity="0.85"/>
      <circle cx="3"  cy="2"  r="0.9" fill="#FF9933" opacity="0.85"/>
      <circle cx="0"  cy="4.5" r="0.8" fill="#FF9933" opacity="0.7"/>
      <line x1="0" y1="-1" x2="-3" y2="2"   stroke="#FF9933" stroke-width="0.5" opacity="0.6"/>
      <line x1="0" y1="-1" x2="3"  y2="2"   stroke="#FF9933" stroke-width="0.5" opacity="0.6"/>
      <line x1="-3" y1="2" x2="0"  y2="4.5" stroke="#FF9933" stroke-width="0.5" opacity="0.6"/>
      <line x1="3"  y1="2" x2="0"  y2="4.5" stroke="#FF9933" stroke-width="0.5" opacity="0.6"/>
    </g>

    <!-- Center dot -->
    <circle r="2" fill="#FF9933"/>
    <circle r="1" fill="#1B6B4D"/>
  </g>

  <!-- ── TEXT (right of icon) ── -->
  <!-- Brand name -->
  <text x="132" y="52"
    font-family="Sora, 'Plus Jakarta Sans', sans-serif"
    font-size="32" font-weight="700"
    fill="#1B6B4D"
    letter-spacing="1">AAROGYA</text>
  <text x="132" y="52"
    font-family="Sora, 'Plus Jakarta Sans', sans-serif"
    font-size="32" font-weight="700"
    fill="#1B6B4D"
    letter-spacing="1"
    dx="178">CIVIC</text>

  <!-- Full name as single text with two-tone -->
  <text x="132" y="52"
    font-family="Sora, 'Plus Jakarta Sans', sans-serif"
    font-size="32" font-weight="800"
    letter-spacing="0.5">
    <tspan fill="#1B6B4D">AAROGYA</tspan><tspan fill="#FF9933">CIVIC</tspan>
  </text>

  <!-- Tagline -->
  <text x="133" y="74"
    font-family="Sora, 'Plus Jakarta Sans', sans-serif"
    font-size="13" font-weight="400"
    fill="#0F4C3A"
    letter-spacing="0.8">Smart Public Service Platform</text>

  <!-- Divider line -->
  <line x1="132" y1="82" x2="510" y2="82" stroke="#1B6B4D" stroke-width="1" opacity="0.2"/>

  <!-- Sub-tagline -->
  <text x="133" y="98"
    font-family="Sora, 'Plus Jakarta Sans', sans-serif"
    font-size="10.5" font-weight="400"
    fill="#2A8A60"
    letter-spacing="1.5">HEALTH · CIVIC · COMMUNITY</text>
</svg>
