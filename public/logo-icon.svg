<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2A8A60"/>
      <stop offset="100%" stop-color="#1B6B4D"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="#0F4C3A" stroke-width="8"/>

  <!-- Outer 8 petals -->
  <g transform="translate(256,256)">
    <ellipse rx="18" ry="40" fill="#E8F3F0" opacity="0.9" transform="rotate(0)   translate(0,-210)"/>
    <ellipse rx="18" ry="40" fill="#E8F3F0" opacity="0.9" transform="rotate(45)  translate(0,-210)"/>
    <ellipse rx="18" ry="40" fill="#E8F3F0" opacity="0.9" transform="rotate(90)  translate(0,-210)"/>
    <ellipse rx="18" ry="40" fill="#E8F3F0" opacity="0.9" transform="rotate(135) translate(0,-210)"/>
    <ellipse rx="18" ry="40" fill="#E8F3F0" opacity="0.9" transform="rotate(180) translate(0,-210)"/>
    <ellipse rx="18" ry="40" fill="#E8F3F0" opacity="0.9" transform="rotate(225) translate(0,-210)"/>
    <ellipse rx="18" ry="40" fill="#E8F3F0" opacity="0.9" transform="rotate(270) translate(0,-210)"/>
    <ellipse rx="18" ry="40" fill="#E8F3F0" opacity="0.9" transform="rotate(315) translate(0,-210)"/>
  </g>

  <!-- Saffron accent dots -->
  <g transform="translate(256,256)" fill="#FF9933">
    <circle r="8" transform="rotate(0)   translate(0,-158)"/>
    <circle r="8" transform="rotate(45)  translate(0,-158)"/>
    <circle r="8" transform="rotate(90)  translate(0,-158)"/>
    <circle r="8" transform="rotate(135) translate(0,-158)"/>
    <circle r="8" transform="rotate(180) translate(0,-158)"/>
    <circle r="8" transform="rotate(225) translate(0,-158)"/>
    <circle r="8" transform="rotate(270) translate(0,-158)"/>
    <circle r="8" transform="rotate(315) translate(0,-158)"/>
  </g>

  <!-- Concentric rings -->
  <circle cx="256" cy="256" r="144" fill="none" stroke="#E8F3F0" stroke-width="4" opacity="0.5"/>
  <circle cx="256" cy="256" r="128" fill="none" stroke="#E8F3F0" stroke-width="2.5" opacity="0.35"/>
  <circle cx="256" cy="256" r="112" fill="none" stroke="#E8F3F0" stroke-width="2" opacity="0.25"/>

  <!-- Inner 8 small petals -->
  <g transform="translate(256,256)" opacity="0.6">
    <ellipse rx="9" ry="20" fill="#E8F3F0" transform="rotate(22.5)  translate(0,-132)"/>
    <ellipse rx="9" ry="20" fill="#E8F3F0" transform="rotate(67.5)  translate(0,-132)"/>
    <ellipse rx="9" ry="20" fill="#E8F3F0" transform="rotate(112.5) translate(0,-132)"/>
    <ellipse rx="9" ry="20" fill="#E8F3F0" transform="rotate(157.5) translate(0,-132)"/>
    <ellipse rx="9" ry="20" fill="#E8F3F0" transform="rotate(202.5) translate(0,-132)"/>
    <ellipse rx="9" ry="20" fill="#E8F3F0" transform="rotate(247.5) translate(0,-132)"/>
    <ellipse rx="9" ry="20" fill="#E8F3F0" transform="rotate(292.5) translate(0,-132)"/>
    <ellipse rx="9" ry="20" fill="#E8F3F0" transform="rotate(337.5) translate(0,-132)"/>
  </g>

  <!-- Center disc -->
  <circle cx="256" cy="256" r="100" fill="#0F4C3A" opacity="0.4"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#E8F3F0" stroke-width="3" opacity="0.6"/>

  <!-- LEAF (top) -->
  <g transform="translate(256, 210)">
    <path d="M0,-36 C20,-26 26,-6 16,16 C8,28 -8,28 -16,16 C-26,-6 -20,-26 0,-36 Z"
      fill="#E8F3F0" stroke="#1B6B4D" stroke-width="2"/>
    <line x1="0" y1="16" x2="0" y2="30" stroke="#1B6B4D" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="-20" x2="-10" y2="-4"  stroke="#1B6B4D" stroke-width="1.8" opacity="0.7"/>
    <line x1="0" y1="-10" x2="-13" y2="6"   stroke="#1B6B4D" stroke-width="1.8" opacity="0.7"/>
    <line x1="0" y1="0"   x2="-10" y2="12"  stroke="#1B6B4D" stroke-width="1.8" opacity="0.7"/>
    <line x1="0" y1="-20" x2="10"  y2="-4"  stroke="#1B6B4D" stroke-width="1.8" opacity="0.7"/>
    <line x1="0" y1="-10" x2="13"  y2="6"   stroke="#1B6B4D" stroke-width="1.8" opacity="0.7"/>
    <line x1="0" y1="0"   x2="10"  y2="12"  stroke="#1B6B4D" stroke-width="1.8" opacity="0.7"/>
  </g>

  <!-- BUILDING (lower-left) -->
  <g transform="translate(218, 278)">
    <rect x="-22" y="-26" width="44" height="44" rx="3" fill="#E8F3F0" stroke="#1B6B4D" stroke-width="2"/>
    <rect x="-22" y="-34" width="44" height="10" rx="2" fill="#FF9933"/>
    <rect x="-18" y="-18" width="10" height="10" rx="1.5" fill="#1B6B4D" opacity="0.8"/>
    <rect x="-4"  y="-18" width="10" height="10" rx="1.5" fill="#1B6B4D" opacity="0.8"/>
    <rect x="10"  y="-18" width="10" height="10" rx="1.5" fill="#1B6B4D" opacity="0.8"/>
    <rect x="-18" y="-4"  width="10" height="10" rx="1.5" fill="#1B6B4D" opacity="0.6"/>
    <rect x="-4"  y="-4"  width="10" height="10" rx="1.5" fill="#1B6B4D" opacity="0.6"/>
    <rect x="10"  y="-4"  width="10" height="10" rx="1.5" fill="#1B6B4D" opacity="0.6"/>
  </g>

  <!-- HEART (lower-right) -->
  <g transform="translate(294, 278)">
    <path d="M0,26 L-26,-6 C-26,-20 -13,-30 0,-20 C13,-30 26,-20 26,-6 Z"
      fill="#E8F3F0" stroke="#1B6B4D" stroke-width="2"/>
    <circle cx="0"   cy="-4" r="5"   fill="#FF9933"/>
    <circle cx="-12" cy="6"  r="3.5" fill="#FF9933" opacity="0.85"/>
    <circle cx="12"  cy="6"  r="3.5" fill="#FF9933" opacity="0.85"/>
    <circle cx="0"   cy="16" r="3"   fill="#FF9933" opacity="0.7"/>
    <line x1="0"   y1="-4" x2="-12" y2="6"  stroke="#FF9933" stroke-width="1.8" opacity="0.6"/>
    <line x1="0"   y1="-4" x2="12"  y2="6"  stroke="#FF9933" stroke-width="1.8" opacity="0.6"/>
    <line x1="-12" y1="6"  x2="0"   y2="16" stroke="#FF9933" stroke-width="1.8" opacity="0.6"/>
    <line x1="12"  y1="6"  x2="0"   y2="16" stroke="#FF9933" stroke-width="1.8" opacity="0.6"/>
  </g>

  <!-- Center unity dot -->
  <circle cx="256" cy="256" r="8" fill="#FF9933"/>
  <circle cx="256" cy="256" r="4" fill="#1B6B4D"/>
</svg>
